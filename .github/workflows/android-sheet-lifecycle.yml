name: Sheet Android real window and exit regression
on:
  push:
    branches: [codex/android-sheet-key-up-20261108]
    paths:
      - .github/workflows/android-sheet-lifecycle.yml
      - android/app/**
      - android/source-lock.json
      - android/gradle/wrapper/gradle-wrapper.properties
      - android/qa/prepare-sheet-assets.cjs
      - android/qa/run-sheet-lifecycle.sh
concurrency:
  group: sheet-android-lifecycle-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read pinned Sheet source
        id: source
        run: echo "commit=$(node -p 'require("./android/source-lock.json").apps.sheet.sourceCommit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beaur8-prog/sheet-studio
          ref: ${{ steps.source.outputs.commit }}
          path: sheet-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sheet-source/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the exact Sheet renderer
        working-directory: sheet-source
        run: npm ci --ignore-scripts && npm run build
      - name: Prepare locked assets and isolated test APK
        run: |
          node android/qa/prepare-sheet-assets.cjs sheet-source
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          cd android
          ./gradlew -PsheetQa :app:assembleSheetDebug :app:assembleSheetDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -camera-back none
          script: bash android/qa/run-sheet-lifecycle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sheet-android-lifecycle-evidence
          retention-days: 14
          path: |
            test-results/sheet-native/
            android/app/build/outputs/apk/sheet/debug/*.apk
