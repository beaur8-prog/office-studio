name: Verify Android signed release APKs
on:
  push:
    branches: [release/android-1.0.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-apk:
    strategy:
      fail-fast: false
      matrix:
        profile: [phone, tablet]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch checksum-pinned private validation inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results/android-inputs
          tag=$(python3 -c 'import json;print(json.load(open("android/verification-inputs.json"))["tag"])')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern ANDROID-VALIDATION-INPUTS.zip --dir test-results
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,os
          lock=json.load(open('android/verification-inputs.json'));p=pathlib.Path('test-results/ANDROID-VALIDATION-INPUTS.zip')
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()==lock['sha256']
          with zipfile.ZipFile(p) as z:
            assert set(z.namelist())=={'sheet.apk','slide.apk','word.apk','sheet-test.apk','slide-test.apk','word-test.apk'}
            z.extractall('test-results/android-inputs')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CERTIFICATE_SHA256='+lock['certificateSHA256']+'\n')
          PY
      - name: Enable isolated emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -camera-back none
          script: bash android/qa/run-emulator.sh ${{ matrix.profile }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-native-${{ matrix.profile }}
          retention-days: 30
          path: |
            test-results/android-native-${{ matrix.profile }}/*.json
            test-results/android-native-${{ matrix.profile }}/*.png
            test-results/android-native-${{ matrix.profile }}/*.log
            test-results/android-native-${{ matrix.profile }}/*.txt
