name: Verify Word Android page and immersive viewer
on:
  push:
    branches: [codex/android-word-viewer]
    paths:
      - android/app/src/**
      - android/app/build.gradle
      - android/source-lock.json
      - android/qa/word-immersive.test.cjs
      - android/qa/run-word-viewer.sh
      - .github/workflows/android-word-viewer.yml
  workflow_dispatch:
concurrency:
  group: word-android-viewer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  word-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: phone
            device: pixel_6
          - profile: tablet
            device: pixel_c
    steps:
      - uses: actions/checkout@v4
        with:
          path: office
          persist-credentials: false
      - name: Read locked Word source
        id: source
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("office/android/source-lock.json"))["apps"]["word"]["sourceCommit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: beaur8-prog/word-studio
          ref: ${{ steps.source.outputs.commit }}
          path: word-studio
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build offline Word UI and isolated QA fixtures
        working-directory: word-studio
        run: |
          npm ci --ignore-scripts
          npm run build
          mkdir -p ../office/android/app/src/word/assets/public ../office/android/app/src/debug/assets/qa
          cp -R dist/. ../office/android/app/src/word/assets/public/
          cp tests/fixtures/hwp/landscape-pagination.hwp ../office/android/app/src/debug/assets/qa/
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {Document,Packer,Paragraph} from 'docx';
          const root='../office/android/app/src/word/assets/public/index.html';
          let html=await fs.readFile(root,'utf8');
          html=html.replace('<head>','<head><script>window.__studioHostConfig={studio:"word",version:"1.0.1"};</script><script src="../studio-host.js"></script>');
          await fs.writeFile(root,html);
          const doc=new Document({sections:[{children:[1,2,3].map(i=>new Paragraph({text:`QA PAGE ${i}`,pageBreakBefore:i>1}))}]});
          await fs.writeFile('../office/android/app/src/debug/assets/qa/viewer.docx',await Packer.toBuffer(doc));
          JS
      - name: Test native bridge flavor boundaries
        working-directory: office
        run: node --test android/qa/word-immersive.test.cjs
      - name: Fetch verified official Gradle distribution
        working-directory: office/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The distribution website redirect can return 504. Use GitHub's
          # documented release download and keep the wrapper's pinned checksum.
          mkdir -p "$RUNNER_TEMP/word-viewer-gradle"
          gh release download v8.13.0 --repo gradle/gradle-distributions --pattern gradle-8.13-bin.zip --dir "$RUNNER_TEMP/word-viewer-gradle"
          python3 <<'PY'
          import hashlib, os
          from pathlib import Path
          properties = Path('gradle/wrapper/gradle-wrapper.properties')
          text = properties.read_text()
          archive = Path(os.environ['RUNNER_TEMP']) / 'word-viewer-gradle/gradle-8.13-bin.zip'
          expected = next(line.split('=', 1)[1] for line in text.splitlines() if line.startswith('distributionSha256Sum='))
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Gradle checksum mismatch'
          properties.write_text('\n'.join('distributionUrl=' + archive.as_uri() if line.startswith('distributionUrl=') else line for line in text.splitlines()) + '\n')
          PY
      - name: Compile isolated debug APKs
        working-directory: office/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          bash gradlew :app:compileWordReleaseJavaWithJavac --no-daemon
          bash gradlew :app:assembleWordDebug :app:assembleWordDebugAndroidTest -PstudioTestBuildType=debug --no-daemon
      - name: Enable isolated emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          avd-name: word-viewer-${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -camera-back none
          script: cd office && bash android/qa/run-word-viewer.sh ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-android-viewer-validation-${{ matrix.profile }}
          retention-days: 3
          path: office/test-results/android-word-viewer/
